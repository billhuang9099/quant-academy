风险与成本。`,`不使用未来数据，不隐藏失败版本，不把回测当作承诺。`,`实盘前依次通过数据、研究、仿真和风险四道闸门。`],practice:`列出三种会让漂亮回测失效的现实条件，并写出对应预防措施。`,deliverable:`个人《量化研究守则》`}],caseStudy:{title:`“连续上涨三天就买入”是不是策略？`,situation:`一句交易想法看似明确，但没有股票池、成交价格、持有期、仓位、成本和退出条件。`,analysis:[`先定义市场与可交易股票池，排除停牌和不可成交标的。`,`明确第三天收盘后产生信号，最早只能在下一可交易时点成交。`,`补上持有期、止损/退出、单票上限、成本模型和比较基准。`],conclusion:`只有当输入、时点、仓位、交易和退出都可复现时，想法才成为策略。`},mistakes:[`把相关性当成稳定因果`,`只描述买入条件，不描述卖出与仓位`,`没有基准就声称“策略有效”`,`用回测最高收益版本代表真实能力`],questions:[{type:`choice`,prompt:`下面哪一项最接近完整的量化策略？`,options:[`我感觉科技股长期更好`,`买入最近涨得多的股票`,`明确股票池、信号时点、持仓权重、调仓、成本和退出规则`,`找到一个与收益高度相关的指标`],answer:`2`,explanation:`完整策略必须能从数据稳定地映射到可执行持仓与交易。`},{type:`boolean`,prompt:`只要规则由计算机执行，它就是可靠的量化策略。`,options:[`正确`,`错误`],answer:`1`,explanation:`自动执行不等于假设可靠、数据正确或风险可控。`},{type:`fill`,prompt:`量化假设必须能够被数据 ______，否则无法形成有效检验。`,answer:`证伪`,accepted:[`证伪`,`否定`,`推翻`],explanation:`可证伪性是科学研究与结果解释的起点。`},{type:`calculation`,prompt:`若一项研究共尝试 20 个独立无效信号，每个都以 5% 显著性筛选，期望出现多少个“假阳性”？`,answer:`1`,accepted:[`1`,`1个`,`一个`],explanation:`20 × 5% = 1，这也是多重检验需要被控制的直观原因。`},{type:`application`,prompt:`把“高分红股票更稳”改写成一个可检验的研究假设。`,placeholder:`请写出股票池、分红指标、观察时点、持有期、基准与验证标准……`,rubric:[`定义了市场、股票池与样本时间`,`指标只能使用当时可获得的数据`,`明确调仓频率、持有期和基准`,`同时定义收益与风险评价标准`]}]},{id:`risk-return`,number:`02`,title:`收益风险`,enTitle:`Risk & Return`,tagline:`收益是结果，风险是为结果付出的代价。`,level:`核心`,duration:`10 小时`,color:`#ffb000`,mentalModel:`不要问“赚了多少”，先问收益来自什么风险、经历了多大损失、是否有足够把握重复。`,outcomes:[`正确计算简单收益、对数收益和累计收益`,`理解波动率、回撤、尾部风险与相关性`,`用基准、夏普和信息比率评价风险调整后表现`],concepts:[{term:`累计收益`,definition:`逐期收益按复利相乘后的总变化，而不是简单相加。`},{term:`年化波动率`,definition:`周期收益标准差按时间尺度换算后的波动强度。`},{term:`最大回撤`,definition:`净值从历史高点到随后低点的最大跌幅。`},{term:`夏普比率`,definition:`单位总波动所获得的超额收益。`},{term:`信息比率`,definition:`单位主动风险所获得的相对基准超额收益。`},{term:`尾部风险`,definition:`小概率但影响巨大的极端损失风险。`}],formula:`Sharpe = (年化收益 − 无风险收益) ÷ 年化波动率`,formulaNote:`夏普比率不能替代回撤、偏度、流动性和极端情景分析。`,lessons:[{title:`收益率与复利`,duration:`55 分钟`,summary:`掌握价格、现金流、复权与不同收益口径。`,points:[`简单收益适合解释投资盈亏；对数收益便于跨期相加。`,`累计收益使用连乘：(1+r₁)(1+r₂)…−1。`,`股票分红、拆分与期货连续合约处理会改变收益序列。`],practice:`计算 +10%、−10% 两期后的累计收益，并解释为何不是 0。`,deliverable:`收益率计算小表`},{title:`波动、回撤与尾部`,duration:`75 分钟`,summary:`从平均波动扩展到路径风险和极端损失。`,points:[`相同年化收益可能对应完全不同的回撤路径。`,`波动率通常假设分布较稳定，但金融收益常有厚尾和波动聚集。`,`VaR 给出阈值，CVaR 关注超过阈值后的平均损失。`],practice:`对两条相同终值、不同路径的净值曲线比较最大回撤与恢复时间。`,deliverable:`风险画像卡`},{title:`风险调整指标`,duration:`70 分钟`,summary:`学会在同一口径下比较策略与基准。`,points:[`夏普关注总波动，信息比率关注相对基准的主动波动。`,`Calmar 用年化收益除以最大回撤，更关注路径损失。`,`指标必须注明频率、区间、无风险利率和成本口径。`],practice:`为趋势、套利和指数增强策略各选择两个主要指标，并说明理由。`,deliverable:`策略评价指标表`},{title:`相关性与分散化`,duration:`60 分钟`,summary:`理解组合风险不仅取决于单个资产，还取决于共同波动。`,points:[`相关性低并不等于危机时仍低，相关结构会随市场状态变化。`,`分散化要看风险来源，不只是持仓数量。`,`相关性估计受样本窗口、异常值与非线性关系影响。`],practice:`解释为什么持有 20 只同一行业股票仍可能高度集中。`,deliverable:`风险来源分解图`}],caseStudy:{title:`策略 A 年赚 18%，策略 B 年赚 14%，一定选 A 吗？`,situation:`A 的年化波动为 28%、最大回撤 35%；B 的波动为 11%、最大回撤 12%。`,analysis:[`收益不能脱离风险比较；A 的收益优势可能只是承担了更多市场暴露。`,`需要统一无风险利率、样本区间、成本与杠杆口径计算风险调整指标。`,`再检查回撤恢复期、尾部损失和与现有组合的相关性。`],conclusion:`策略选择应服从组合目标与风险预算，不由单一收益排名决定。`},mistakes:[`把月收益直接乘 12 当作严格年化复利收益`,`只看波动率，忽略最大回撤与尾部`,`比较不同区间、不同成本口径的夏普`,`认为历史低相关必然持续`],questions:[{type:`choice`,prompt:`哪个指标最直接描述净值从历史高点跌至低点的路径损失？`,options:[`年化收益`,`最大回撤`,`胜率`,`换手率`],answer:`1`,explanation:`最大回撤刻画了历史峰值到随后谷值的最深损失。`},{type:`boolean`,prompt:`两个策略的年化收益相同，它们对投资者的风险体验也相同。`,options:[`正确`,`错误`],answer:`1`,explanation:`波动、回撤路径、尾部损失和恢复时间都可能完全不同。`},{type:`fill`,prompt:`衡量超过 VaR 阈值后平均损失的指标通常称为 ______。`,answer:`CVaR`,accepted:[`cvar`,`CVaR`,`条件风险价值`,`预期损失`],explanation:`CVaR/Expected Shortfall 关注尾部被触发后的平均损失。`},{type:`calculation`,prompt:`先上涨 20%，随后下跌 20%，累计收益率是多少？请填写百分比。`,answer:`-4%`,accepted:[`-4%`,`-4`,`负4%`,`负4`],explanation:`1.2 × 0.8 − 1 = −4%，涨跌幅不能简单相抵。`},{type:`application`,prompt:`为一个“年化 15%、最大回撤 25%”的策略写一份三点风险说明。`,placeholder:`至少涉及风险调整表现、回撤承受力、样本或尾部限制……`,rubric:[`没有把历史收益写成未来承诺`,`解释了最大回撤的资金与心理含义`,`指出波动、尾部、流动性或样本不确定性`,`提出了仓位或风险预算约束`]}]},{id:`backtesting`,number:`03`,title:`回测验证`,enTitle:`Backtesting`,tagline:`回测不是找最好看的曲线，而是尽力推翻自己。`,level:`核心`,duration:`12 小时`,color:`#47b881`,mentalModel:`回测是有约束的历史模拟。它的价值在于暴露策略在数据、成本、时点和样本外的脆弱性。`,outcomes:[`避免未来函数、幸存者偏差和数据窥探`,`构建训练、验证、测试和走步检验`,`建立包含费用、滑点和容量的成本模型`],concepts:[{term:`未来函数`,definition:`在历史决策时使用了当时尚不可得的信息。`},{term:`幸存者偏差`,definition:`只保留今天仍存在的标的，遗漏退市或消失样本。`},{term:`样本外`,definition:`未参与策略选择和调参的数据区间。`},{term:`走步检验`,definition:`按时间滚动训练，并在紧随其后的区间检验。`},{term:`滑点`,definition:`理论成交价与实际可成交价之间的差异。`},{term:`容量`,definition:`在不显著推高冲击成本前策略可承载的资金规模。`}],formula:`净收益 = 毛收益 − 佣金 − 税费 − 买卖价差 − 市场冲击`,formulaNote:`成本应随换手、流动性、订单规模与市场状态变化。`,lessons:[{title:`回测时间轴`,duration:`70 分钟`,summary:`严格区分数据发生、公布、信号生成、下单与成交时点。`,points:[`日收盘数据生成的信号通常不能按同一收盘价无摩擦成交。`,`财务数据应使用披露日而非报告期结束日。`,`调仓日、停牌、涨跌停和成交量约束都要进入模拟。`],practice:`为“收盘后计算动量、次日交易”画出完整时间轴。`,deliverable:`无未来函数时间线`},{title:`偏差与数据清洗`,duration:`85 分钟`,summary:`系统识别会让回测虚高的数据问题。`,points:[`使用历史成分股，不能用今天的指数成分回看过去。`,`异常值处理规则应只依赖当时截面，不偷看未来分布。`,`缺失值是信息：需要说明删除、填充或不可交易的含义。`],practice:`审计一份因子数据：列出时间戳、缺失、复权、退市和版本风险。`,deliverable:`数据质量检查表`},{title:`样本外与稳健性`,duration:`90 分钟`,summary:`通过时间切分、参数平台与压力测试判断是否过拟合。`,points:[`金融时间序列通常不能随机打乱后交叉验证。`,`稳定策略应在一片参数区域表现合理，而非只在一个尖点最好。`,`改变成本、延迟、股票池、市场和起止时间检验结论。`],practice:`为一个 10 年样本设计训练、验证、最终测试和走步窗口。`,deliverable:`验证方案`},{title:`成本、容量与报告`,duration:`75 分钟`,summary:`把可交易性写进回测，并形成可审计报告。`,points:[`费用是固定项，价差和冲击通常随流动性与订单参与率变化。`,`高换手小盘策略最容易被成本和容量击穿。`,`报告同时展示基准、毛/净收益、换手、回撤、暴露与失败阶段。`],practice:`将单边成本从 5bp 提高到 10、20、40bp，记录策略何时失效。`,deliverable:`成本敏感性报告`}],caseStudy:{title:`99% 胜率的隔夜策略`,situation:`回测用当天收盘价计算全市场排名，又假设能够按同一收盘价买入。`,analysis:[`信号依赖完整收盘数据，决策时点已经晚于假设成交时点。`,`修正为次日开盘或可执行的成交窗口，并加入跳空和滑点。`,`再用历史股票池、停牌约束与样本外区间重新检验。`],conclusion:`异常漂亮的结果首先要被当作数据或时点错误线索，而非天才发现。`},mistakes:[`随机切分时间序列训练集与测试集`,`用今天的指数成分股回测十年前`,`反复查看测试集并继续调参`,`用固定零滑点评价高换手策略`],questions:[{type:`choice`,prompt:`财务因子回测应优先使用哪个日期决定信息何时可用？`,options:[`报告期结束日`,`财务报表披露日`,`数据下载日`,`当前日期`],answer:`1`,explanation:`市场只能在披露后使用财务信息。`},{type:`boolean`,prompt:`最终测试集表现不佳时，可以继续调参直到测试集通过。`,options:[`正确`,`错误`],answer:`1`,explanation:`反复使用测试集会让它变成训练信息，失去样本外意义。`},{type:`fill`,prompt:`只使用当前仍存续股票回看历史会产生 ______ 偏差。`,answer:`幸存者`,acce
